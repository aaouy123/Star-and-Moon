mode: rule
mixed-port: 10801
allow-lan: false
log-level: info
ipv6: true
secret: ""
external-controller: 127.0.0.1:9090
find-process-mode: strict
unified-delay: false
tcp-concurrent: true
keep-alive-interval: 30
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
geox-url:
  geoip: "https://github.moeyy.xyz/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.moeyy.xyz/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://raw.githubusercontent.com/xishang0128/geoip/release/GeoLite2-ASN.mmdb"
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
global-ua: clash.meta
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: false
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip # redir-host/fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "geosite:private,cn"
    - "geosite:googlefcm"
  default-nameserver:
    - 223.5.5.5
    - 120.53.53.53
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://94.140.14.14/dns-query#h3=true
  nameserver-policy:
    geosite:googlefcm:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    rule-set:Lan_blackmatrix7:
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    "geosite:cn,private":
      - https://223.6.6.6/dns-query
      - https://120.53.53.53/dns-query
    "geosite:gfw,geolocation-!cn":
      - https://dns.cloudflare.com/dns-query
      - https://94.140.14.14/dns-query#h3=true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: false
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports:
        - 443
        - 5228
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    QUIC:
      ports:
        - 443
        - 5228
        - 8443
  force-domain:
    - "+.v2ex.com"
    - "geosite:googlefcm"
    - "google.com"
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.apple.com"
proxies:
  - name: dns-out
    type: dns
    udp: true
proxy-providers:
  1.provider:
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
      expected-status: 204
    url: ""
    path: ./proxy_providers/provider_subscribe1.yaml
  2.provider:
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true
      expected-status: 204
    url: ""
    path: ./proxy_providers/provider_subscribe2.yaml
proxy-groups:
  - name: 🌟 总模式
    type: select
    proxies:
      - 🚀 节点选择
      - 🪐 自动切换
      - ☀️ 手动切换1
      - 🌙 手动切换2
      - ✨ 负载均衡
      - 🔗 链式代理
      - provider_one
      - provider_two
      - 🌎 全球直连
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🇺🇳 其它地区
  - name: 🚀 节点选择
    type: select
    proxies:
      - 🪐 自动切换
      - 🌎 全球直连
    include-all-providers: true
  - name: 🪐 自动切换
    type: url-test
    url: https://www.google.com/generate_204
    interval: 300
    tolerance: 20
    lazy: true
    timeout: 2000
    max-failed-times: 5
    expected-status: 204
    include-all-providers: true
    filter: (?i)^(?!.*emby).*
  - name: ☀️ 手动切换1
    type: select
    proxies:
      - 🚀 节点选择
      - 🌎 全球直连
    include-all-providers: true
